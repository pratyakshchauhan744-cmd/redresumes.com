[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build && PUPPETEER_EXECUTABLE_PATH=\"$(command -v chromium)\" npm run test:pdf-runtime && npx prisma migrate deploy"

[deploy]
startCommand = "PUPPETEER_EXECUTABLE_PATH=\"$(command -v chromium)\" npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
